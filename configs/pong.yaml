# configs/pong.yaml
seed: 42
env_id: PongNoFrameskip-v4
total_frames: 3000000        # frames = env steps after frame-skip
eval_every_frames: 100000
eval_episodes: 20

agent:
  gamma: 0.99
  n_step: 3
  double_dqn: true
  dueling: true
  noisy_nets: false
  tau: 0.001
  lr: 1.0e-4
  grad_clip: 10.0
  use_amp: true

network:
  type: cnn         # Nature DQN
  channels: [32, 64, 64]
  convs:
    - [32, 8, 4]    # out_channels, kernel, stride
    - [64, 4, 2]
    - [64, 3, 1]
  linear: 512

replay:
  type: per         # ["uniform", "per"]
  capacity: 200000
  batch_size: 32
  warmup_steps: 50000
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0

exploration:
  strategy: epsilon_greedy       # or "cosine"
  eps_start: 1.0
  eps_end: 0.01
  eps_decay_frames: 1000000

wrappers:
  frame_skip: 4                  # handled by MaxAndSkip
  grayscale: true
  resize: [84, 84]
  frame_stack: 4
  clip_reward: true
  episodic_life: true
  noop_max: 30
  fire_reset: false             # Pong doesn't need FIRE

logging:
  log_dir: artifacts
  tb: true
  mlflow: false
  video_every_eval: true
