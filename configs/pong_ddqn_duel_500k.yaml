run_name: pong_ddqn_duel_500k
seed: 0
env:
  env_id: PongNoFrameskip-v4
  frame_stack: 4
  noop_max: 30
  skip: 4
  minimal_actions: true

log:
  out_dir: D:/ML/LS/Deep_learning/Reinforcement_learning/project/artifacts_pong/tensorboard
  save_dir: D:/ML/LS/Deep_learning/Reinforcement_learning/project/artifacts_pong/checkpoints
  plots_dir: D:/ML/LS/Deep_learning/Reinforcement_learning/project/artifacts_pong/plots
  log_interval: 1000

train:
  total_frames: 500000
  warmup: 50000
  batch_size: 32
  gamma: 0.99
  n_step: 1
  target_update_freq: 10000
  grad_clip_norm: 10.0
  save_every: 100000

optimizer:
  name: adam
  lr: 0.00025

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 500000

replay:
  type: uniform
  capacity: 1000000

model:
  dueling: true
