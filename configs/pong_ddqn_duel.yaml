env_id: PongNoFrameskip-v4
seed: 42
wrappers:
  noop_max: 30
  frame_skip: 4
  resize: [84, 84]
  grayscale: true
  frame_stack: 4
  clip_reward: true

algo:
  name: ddqn
  dueling: true
  n_step: 1
  gamma: 0.99
  tau: 1.0           # >=1.0 → hard-update (см. target_update_interval ниже)

optim:
  lr: 1.0e-4
  batch_size: 32
  grad_clip: 10.0
  amp: true          # CUDA AMP включен

replay:
  type: uniform
  capacity: 100000
  warmup_steps: 50000
  batch_size: 32

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 1500000  # подлиннее, чем в бейзлайне

train:
  total_frames: 2000000
  target_update_interval: 10000   # hard-update каждые 10k шагов
  save_every_frames: 200000
  render_eval: false

log:
  out_dir: D:/ML/LS/Deep_learning/Reinforcement_learning/project/artifacts_pong/tensorboard
  save_dir: D:/ML/LS/Deep_learning/Reinforcement_learning/project/artifacts_pong/checkpoints

model_name: ddqn_duel_uniform@2M
