seed: 12345
env_id: PongNoFrameskip-v4
algo:
  name: ddqn
  dueling: true
  n_step: 3
  gamma: 0.99
  tau: 0.005
replay:
  type: per
  capacity: 1000000
  alpha: 0.5
  beta:
    start: 0.4
    end: 1.0
    decay_frames: 1500000
optimizer:
  name: adam
  lr: 0.00025
  eps: 1.0e-08
  weight_decay: 0.0
schedule:
  epsilon:
    start: 1.0
    end: 0.1
    decay_frames: 1500000
train:
  total_frames: 3000000
  warmup_steps: 50000
  batch_size: 64
  target_update_freq: 10000
  save_every: 200000
  frame_stack: 4
  minimal_actions: true
